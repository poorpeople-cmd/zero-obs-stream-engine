name: Zero-OBS Direct Stream

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Web page URL containing the video player"
        required: true
        type: string
      stream_key:
        description: "Stream Key ID (e.g. 1, 1.4, s1.1) or custom key/RTMP URL"
        required: true
        default: "1"
        type: string
      stream_quality:
        description: "Stream Quality & Bitrate"
        required: false
        default: "Original (1080p Max)"
        type: choice
        options:
          - "Original (1080p Max)"
          - "1080p"
          - "720p"
          - "480p"
          - "360p"
      force_refresh_minutes:
        description: "Auto-refresh stream token every X minutes (0 = disabled)"
        required: false
        default: "0"
        type: string
      duration_minutes:
        description: "Maximum stream duration in minutes (max 340)"
        required: false
        default: "180"
        type: string

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Chrome for Testing
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-dependencies: true

      - name: Install FFmpeg and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb

      - name: Run Smart Stream Engine
        env:
          SOURCE_URL: ${{ github.event.inputs.source_url }}
          STREAM_KEY: ${{ github.event.inputs.stream_key }}
          STREAM_QUALITY: ${{ github.event.inputs.stream_quality }}
          FORCE_REFRESH_MINUTES: ${{ github.event.inputs.force_refresh_minutes }}
          DURATION_MINUTES: ${{ github.event.inputs.duration_minutes }}
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" node bridge.js
